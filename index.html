<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="sty.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="main-body">
        <div class="calc">
            <div class="output">
                <input type="text" id="screen" value="0" aria-label="Calculator display" readonly>

            </div>
            <div class="buttons">
                <button type="button" onclick="clearDisplay()" class="btn">C</button>
            <div class="row">
                <button type="button" onclick="buttonclick(7)" class="btn">7</button>
                <button type="button" onclick="buttonclick(8)" class="btn">8</button>
                <button type="button" onclick="buttonclick(9)" class="btn">9</button>
                <button type="button" onclick="buttonclick('/')" class="btn">/</button>

            </div>
            <div class="row">
                <button type="button" onclick="buttonclick(4)" class="btn">4</button>
                <button type="button" onclick="buttonclick(5)" class="btn">5</button>
                <button type="button" onclick="buttonclick(6)" class="btn">6</button>
                <button type="button" onclick="buttonclick('*')" class="btn">X</button>

            </div>
            <div class="row">
                <button type="button" onclick="buttonclick(1)" class="btn">1</button>
                <button type="button" onclick="buttonclick(2)" class="btn">2</button>
                <button type="button" onclick="buttonclick(3)" class="btn">3</button>
                <button type="button" onclick="buttonclick('-')" class="btn">-</button>

            </div>
            <div class="row">
                <button type="button" onclick="buttonclick('.')" class="btn">.</button>
                <button type="button" onclick="buttonclick(0)" class="btn">0</button>
                <button type="button" onclick="equalClick()" class="btn">=</button>
                <button type="button" onclick="buttonclick('+')" class="btn">+</button>

            </div>

            </div>

        </div>

    </div>
</body>
</html>
